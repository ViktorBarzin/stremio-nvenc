name: Build and Push

# Off-infra build (ADR-0002). Canonical repo is Forgejo viktor/stremio-nvenc, which
# push-mirrors to ViktorBarzin/stremio-nvenc on GitHub; this workflow builds on
# GitHub-hosted runners, pushes the image to GHCR, then (once wired) signals the
# Woodpecker deploy pipeline to roll the cluster — the homelab never sees build IO.
#
# Commit this on the FORGEJO side (the mirror is one-way; commits made on GitHub are
# overwritten by the next sync). Modelled on infra/scripts/offinfra-templates/build.yml.tmpl.
# No svu tag step (this is a thin image-assembly repo, not a versioned first-party app).
on:
  push:
    branches: [master]
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.sha }}
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        run: echo "sha=$(echo ${{ github.sha }} | cut -c1-8)" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          push: true
          platforms: linux/amd64
          # Single-manifest image (no provenance/SBOM attestation children) so
          # registry retention can never orphan index children (ADR-0002).
          provenance: false
          tags: |
            ghcr.io/viktorbarzin/stremio-nvenc:${{ steps.meta.outputs.sha }}
            ghcr.io/viktorbarzin/stremio-nvenc:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # Keep the newest ~10 versions on ghcr (`:latest` rides the newest one).
      - name: ghcr retention (keep 10)
        uses: actions/delete-package-versions@v5
        continue-on-error: true
        with:
          package-name: stremio-nvenc
          package-type: container
          min-versions-to-keep: 10

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      # TODO(onboarding): wire the Woodpecker deploy once the GitHub-mirror repo
      # (ViktorBarzin/stremio-nvenc) is registered in Woodpecker and its NUMERIC
      # repo id is known. Then:
      #   1. set WP_REPO_ID below to that numeric id (owner/name returns HTML — must be numeric),
      #   2. add the WOODPECKER_TOKEN repo secret,
      #   3. create .woodpecker/deploy.yml (event: manual) running
      #      `kubectl set image deployment/stremio stremio=$IMAGE_NAME:$IMAGE_TAG -n stremio`.
      # Until WP_REPO_ID is set this step is a no-op so the pipeline stays green.
      # Modelled on infra/scripts/offinfra-templates/{build,deploy}.yml.tmpl.
      - name: Trigger Woodpecker deploy (STUB - not yet wired)
        env:
          WP_REPO_ID: ""   # TODO: numeric Woodpecker repo id of the ViktorBarzin/stremio-nvenc mirror
          WOODPECKER_TOKEN: ${{ secrets.WOODPECKER_TOKEN }}
          IMAGE_TAG: ${{ needs.build.outputs.image_tag }}
          IMAGE_NAME: ghcr.io/viktorbarzin/stremio-nvenc
        run: |
          if [ -z "$WP_REPO_ID" ]; then
            echo "::notice::deploy stub - WP_REPO_ID unset; skipping Woodpecker trigger (wire during onboarding)."
            exit 0
          fi
          for attempt in 1 2 3; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
              "https://ci.viktorbarzin.me/api/repos/${WP_REPO_ID}/pipelines" \
              -H "Authorization: Bearer ${WOODPECKER_TOKEN}" \
              -H "Content-Type: application/json" \
              -d "{\"branch\":\"master\",\"variables\":{\"IMAGE_TAG\":\"${IMAGE_TAG}\",\"IMAGE_NAME\":\"${IMAGE_NAME}\"}}")
            if [ "$STATUS" -ge 200 ] && [ "$STATUS" -lt 300 ]; then
              echo "Woodpecker deploy triggered (HTTP $STATUS)"; exit 0
            fi
            echo "Attempt $attempt failed (HTTP $STATUS), retrying in 30s..."; sleep 30
          done
          echo "Failed to trigger Woodpecker deploy after 3 attempts"; exit 1
